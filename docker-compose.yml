version: '3.8'

services:
  # Relational Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: skillbridge-postgres
    restart: always
    environment:
      POSTGRES_DB: skillbridge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillbridge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: skillbridge-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # In-Memory Cache: Redis 7
  redis:
    image: redis:7-alpine
    container_name: skillbridge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Object Store: MinIO
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: skillbridge-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin_secret_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
